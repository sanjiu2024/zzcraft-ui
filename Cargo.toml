[package]
name = "zzcraft-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Missing pieces for building information-dense GPUI applications: table shell, form validation and localized number formatting."
repository = "https://github.com/sanjiu2024/zzcraft-ui"
homepage = "https://github.com/sanjiu2024/zzcraft-ui"
keywords = ["gpui", "ui", "table", "format"]
categories = ["gui"]

[dependencies]
gpui-kit = { version = "0.11.0", optional = true }

[features]
default = []
# Rendering pieces (table shell, form field) need the GPUI stack. The pure
# formatting module stays usable without it, which keeps `cargo test` fast and
# lets the library be consumed by non-GUI tooling.
gpui = ["dep:gpui-kit"]
